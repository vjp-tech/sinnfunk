# Holt den Sinnfunk-Podcast-Feed stündlich aus Supabase und legt ihn als
# podcast.xml auf die Website (https://sinnfunk.live/podcast.xml).
# Manuell auslösen: GitHub -> Reiter "Actions" -> "Podcast-Feed aktualisieren" -> "Run workflow"

name: Podcast-Feed aktualisieren

on:
  schedule:
    - cron: '7 * * * *'      # jede Stunde (Minute 7)
  workflow_dispatch:          # Knopf zum sofortigen Aktualisieren

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feed von Supabase holen
        run: |
          curl -fsS https://mliatnfqgnctbxhbwhzp.supabase.co/functions/v1/podcast-feed -o neu.xml
          # Nur übernehmen, wenn wirklich ein RSS-Feed zurückkam
          if head -c 200 neu.xml | grep -q '<rss'; then
            mv neu.xml podcast.xml
          else
            echo "Kein gültiger Feed erhalten – podcast.xml bleibt unverändert."
            rm neu.xml
          fi

      - name: Speichern, falls sich etwas geändert hat
        run: |
          git config user.name "sinnfunk-bot"
          git config user.email "servus@sinnfunk.live"
          git add podcast.xml
          git diff --cached --quiet || (git commit -m "Podcast-Feed aktualisiert" && git push)
