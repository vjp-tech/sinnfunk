<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinnfunker – Sinnfunk</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="image/icon.webp" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* Nutzt die gemeinsamen Tokens aus style.css – nur seitenspezifisches Layout. */

    .sf-profil-wrap {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 80px;
    }

    .sf-zurueck {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-deep);
      text-decoration: none;
      margin: 28px 0 22px;
    }
    .sf-zurueck:hover { text-decoration: underline; }

    /* ── Zustände: Laden / Nicht gefunden ── */
    .sf-loading, .sf-not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 100px 24px;
      color: var(--muted);
      font-family: var(--font-body);
      text-align: center;
    }
    .sf-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(168,148,92,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sf-not-found h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--ink);
      font-weight: 600;
    }

    /* ── Profil-Header ── */
    .sf-profil-hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 40px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .sf-profil-avatar {
      width: 128px; height: 128px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid rgba(168,148,92,0.3);
      background: rgba(168,148,92,0.12);
    }
    .sf-profil-avatar-placeholder {
      width: 128px; height: 128px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(168,148,92,0.6), rgba(53,61,46,0.5));
      display: grid;
      place-items: center;
      font-size: 2.8rem;
      color: #fff;
      font-family: var(--font-display);
    }
    .sf-profil-meta { flex: 1; min-width: 240px; }
    .sf-profil-category {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      background: rgba(168,148,92,0.18);
      color: var(--gold-deep);
    }
    .sf-profil-name {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .sf-profil-subtitle {
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .sf-profil-bio {
      font-family: var(--font-body);
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--ink-soft);
      margin-bottom: 18px;
      white-space: pre-line;
    }
    .sf-profil-links {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sf-social {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .sf-social a {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(168,148,92,0.1);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 0.92rem;
      color: var(--gold-deep);
      text-decoration: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .sf-social a:hover { background: rgba(168,148,92,0.2); }
    .sf-profil-website {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--gold-deep);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(168,148,92,0.4);
      padding-bottom: 1px;
    }
    .sf-profil-website:hover { border-color: var(--gold-deep); }

    /* ── Abschnitte (Produkte / Episoden) ── */
    .sf-abschnitt { margin-top: 48px; }
    .sf-abschnitt-titel {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .sf-leer {
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--muted);
      padding: 20px 0;
    }

    /* ── Produkte ── */
    .sf-produkte-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .sf-produkt-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px;
      display: flex;
      gap: 14px;
    }
    .sf-produkt-bild {
      width: 64px; height: 64px;
      border-radius: 9px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }
    .sf-produkt-info { flex: 1; min-width: 0; }
    .sf-produkt-typ {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold-deep);
      margin-bottom: 4px;
    }
    .sf-produkt-titel {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 5px;
    }
    .sf-produkt-beschreibung {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .sf-produkt-link {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold-deep);
      text-decoration: none;
      border-bottom: 1px solid rgba(168,148,92,0.4);
    }
    .sf-produkt-link:hover { border-color: var(--gold-deep); }
    .sf-produkt-termin {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── Episoden-Player ── */
    .sf-player {
      background: var(--forest);
      color: var(--cream);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .sf-player-kopf {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 30px 32px 22px;
    }
    .sf-player-bild,
    .sf-player-bild-platzhalter {
      width: 150px; height: 150px;
      border-radius: var(--radius);
      flex-shrink: 0;
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .sf-player-bild-platzhalter {
      background: linear-gradient(135deg, rgba(168,148,92,0.8), rgba(53,61,46,0.6));
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 3.4rem;
      color: #fff;
    }
    .sf-player-info { flex: 1; min-width: 0; }
    .sf-player-label {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .sf-player-titel {
      font-family: var(--font-display);
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.15;
      color: var(--cream);
      margin-bottom: 6px;
    }
    .sf-player-name {
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: rgba(246,241,232,0.65);
    }

    .sf-player-steuerung { padding: 0 32px 22px; }
    .sf-player-balken {
      --fortschritt: 0%;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: linear-gradient(to right, var(--gold) var(--fortschritt), rgba(246,241,232,0.25) var(--fortschritt));
      cursor: pointer;
      outline: none;
      margin: 0;
    }
    .sf-player-balken::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--cream);
      border: 2px solid var(--gold);
    }
    .sf-player-balken::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cream);
      border: 2px solid var(--gold);
    }
    .sf-player-zeiten {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-body);
      font-size: 0.75rem;
      color: rgba(246,241,232,0.6);
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }
    .sf-player-knoepfe {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 8px;
    }
    .sf-player-knopf {
      background: none;
      border: none;
      color: var(--cream);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 6px;
      border-radius: 50%;
      position: relative;
    }
    .sf-player-knopf:hover { color: var(--gold); }
    .sf-player-knopf svg { width: 28px; height: 28px; }
    .sf-player-knopf span {
      position: absolute;
      bottom: -10px;
      font-family: var(--font-body);
      font-size: 0.62rem;
      font-weight: 600;
      color: rgba(246,241,232,0.6);
    }
    .sf-player-play {
      width: 58px; height: 58px;
      background: var(--gold);
      color: #fff;
    }
    .sf-player-play:hover { background: var(--gold-deep); color: #fff; }
    .sf-player-play svg { width: 26px; height: 26px; }

    .sf-player-beschreibung {
      font-family: var(--font-body);
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(246,241,232,0.8);
      margin: 12px 0 0;
    }
    .sf-player-beschreibung:empty { display: none; }

    .sf-player-liste {
      list-style: none;
      margin: 0;
      padding: 4px 32px 28px;
      background: transparent;   /* Grün vom Player bleibt sichtbar */
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
    }
    .sf-player-eintrag {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      background: var(--paper);
      border: 1.5px solid var(--forest);
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      padding: 12px 18px;
      color: var(--ink);
      font: inherit;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .sf-player-eintrag:hover { background: var(--paper-warm); box-shadow: var(--shadow); }
    .sf-player-eintrag-nr {
      width: 34px; height: 34px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid var(--forest);
      color: var(--forest);
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sf-player-eintrag-text { flex: 1; min-width: 0; }
    .sf-player-eintrag-titel {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
    }
    .sf-player-eintrag-datum,
    .sf-player-eintrag-dauer {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .sf-player-eintrag-dauer { flex-shrink: 0; font-variant-numeric: tabular-nums; }
    /* Gerade gewählte Episode */
    .sf-player-eintrag.aktiv { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .sf-player-eintrag.aktiv .sf-player-eintrag-nr { background: var(--gold); border-color: var(--gold); color: #fff; }

    @media (max-width: 700px) {
      .sf-profil-hero { padding: 28px 22px; }
      .sf-produkte-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .sf-player-kopf { gap: 16px; padding: 22px 20px 18px; }
      .sf-player-bild, .sf-player-bild-platzhalter { width: 88px; height: 88px; font-size: 2.2rem; }
      .sf-player-titel { font-size: 1.35rem; }
      .sf-player-steuerung { padding: 0 20px 20px; }
      .sf-player-kopf { align-items: flex-start; }
      .sf-player-liste { padding: 4px 14px 20px; }
      .sf-player-eintrag { padding: 10px 12px; gap: 12px; }
    }
    @media (max-width: 560px) {
      .sf-social {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="page">

  <div id="sf-nav"></div>
  <script src="nav.js"></script>

  <main>
    <div class="sf-profil-wrap">

      <a class="sf-zurueck" href="community.html">← Alle Sinnfunker</a>

      <div id="sf-inhalt">
        <div class="sf-loading">
          <div class="sf-spinner"></div>
          <p>Profil wird geladen …</p>
        </div>
      </div>

    </div>
  </main>

  <div id="sf-footer"></div>
  <script src="footer.js"></script>

</div>

<script>
  const SUPABASE_URL  = 'https://mliatnfqgnctbxhbwhzp.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_KocEqg2UUL2trsGXb_kacA_yfY8DIP3';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const inhalt = document.getElementById('sf-inhalt');
  const slug = new URLSearchParams(window.location.search).get('name');

  async function ladeProfil() {
    if (!slug) { zeigeNichtGefunden(); return; }

    const { data: sf, error } = await db
      .from('sinnfunker')
      .select('id, name, subtitle, biography, photo_url, website, facebook, instagram, extra_link, category')
      .eq('slug', slug)
      .in('status', ['aktiv', 'freigegeben'])
      .maybeSingle();

    if (error || !sf) { zeigeNichtGefunden(); return; }

    document.title = sf.name + ' – Sinnfunk';

    const [{ data: produkte }, { data: episodenRoh }] = await Promise.all([
      db.from('products')
        .select('id, title, description, product_type, provider, link_url, image_url, event_date')
        .eq('sinnfunker_id', sf.id)
        .order('title'),
      db.from('episodes')
        .select('id, title, description, duration, audio_url, submitted_at')
        .eq('sinnfunker_id', sf.id)
        .eq('status', 'aktiv')
        .order('submitted_at', { ascending: false }),
    ]);

    renderProfil(sf, produkte || [], episodenRoh || []);
  }

  function renderProfil(sf, produkte, episoden) {
    const initial = sf.name ? sf.name.charAt(0).toUpperCase() : '?';
    const avatar = sf.photo_url
      ? `<img class="sf-profil-avatar" src="${esc(sf.photo_url)}" alt="${esc(sf.name)}" />`
      : `<div class="sf-profil-avatar-placeholder">${initial}</div>`;
    const categoryBadge = sf.category
      ? `<span class="sf-profil-category">${esc(sf.category)}</span>` : '';

    const socials = [
      sf.instagram  && `<a href="${esc(sf.instagram)}"  target="_blank" rel="noopener" title="Instagram">▣</a>`,
      sf.facebook   && `<a href="${esc(sf.facebook)}"   target="_blank" rel="noopener" title="Facebook">f</a>`,
      sf.extra_link && `<a href="${esc(sf.extra_link)}" target="_blank" rel="noopener" title="Weiterer Link">🔗</a>`,
    ].filter(Boolean).join('');
    const socialBlock = socials ? `<div class="sf-social">${socials}</div>` : '';

    let websiteLink = '';
    if (sf.website) {
      try {
        const hostname = new URL(sf.website).hostname;
        websiteLink = `<a class="sf-profil-website" href="${esc(sf.website)}" target="_blank" rel="noopener">${hostname} →</a>`;
      } catch (e) {
        websiteLink = `<a class="sf-profil-website" href="${esc(sf.website)}" target="_blank" rel="noopener">Website →</a>`;
      }
    }

    const produkteAbschnittHTML = produkte.length ? `
      <div class="sf-abschnitt">
        <div class="sf-abschnitt-titel">Produkte &amp; Angebote</div>
        <div class="sf-produkte-grid">${produkte.map(produktHTML).join('')}</div>
      </div>` : '';

    const mitAudio = episoden.filter(ep => ep.audio_url);
    const episodenHTML = mitAudio.length
      ? playerHTML(sf, mitAudio, initial)
      : `<p class="sf-leer">Noch keine Episoden zum Nachhören.</p>`;

    inhalt.innerHTML = `
      <div class="sf-profil-hero">
        ${avatar}
        <div class="sf-profil-meta">
          ${categoryBadge}
          <div class="sf-profil-name">${esc(sf.name)}</div>
          ${sf.subtitle ? `<div class="sf-profil-subtitle">${esc(sf.subtitle)}</div>` : ''}
          ${sf.biography ? `<p class="sf-profil-bio">${esc(sf.biography)}</p>` : ''}
          <div class="sf-profil-links">
            ${socialBlock}
            ${websiteLink}
          </div>
        </div>
      </div>

      ${produkteAbschnittHTML}

      <div class="sf-abschnitt">
        <div class="sf-abschnitt-titel">Episoden zum Nachhören</div>
        ${episodenHTML}
      </div>
    `;

    if (mitAudio.length) startePlayer(sf, mitAudio);
  }

  function produktHTML(p) {
    const bild = p.image_url ? `<img class="sf-produkt-bild" src="${esc(p.image_url)}" alt="${esc(p.title)}" />` : '';
    const termin = p.event_date
      ? `<div class="sf-produkt-termin">📅 ${new Date(p.event_date).toLocaleDateString('de-AT')}</div>` : '';
    return `
      <div class="sf-produkt-card">
        ${bild}
        <div class="sf-produkt-info">
          ${p.product_type ? `<div class="sf-produkt-typ">${esc(p.product_type)}</div>` : ''}
          <div class="sf-produkt-titel">${esc(p.title)}</div>
          ${p.description ? `<p class="sf-produkt-beschreibung">${esc(p.description)}</p>` : ''}
          ${termin}
          ${p.link_url ? `<a class="sf-produkt-link" href="${esc(p.link_url)}" target="_blank" rel="noopener">Ansehen →</a>` : ''}
        </div>
      </div>`;
  }

  /* ── Episoden-Player ── */
  const ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICON_ZURUECK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12zM21 6v12l-8.5-6z"/></svg>';
  const ICON_VOR     = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg>';
  const SPRUNG = 15; // Sekunden pro Klick auf die Pfeiltasten

  function playerHTML(sf, episoden, initial) {
    const bild = sf.photo_url
      ? `<img class="sf-player-bild" src="${esc(sf.photo_url)}" alt="${esc(sf.name)}" />`
      : `<div class="sf-player-bild-platzhalter">${initial}</div>`;
    const liste = episoden.map((ep, i) => `
      <li>
        <button class="sf-player-eintrag" data-index="${i}" type="button">
          <div class="sf-player-eintrag-nr">${i + 1}</div>
          <div class="sf-player-eintrag-text">
            <div class="sf-player-eintrag-titel">${esc(ep.title)}</div>
            ${ep.submitted_at ? `<div class="sf-player-eintrag-datum">${new Date(ep.submitted_at).toLocaleDateString('de-AT')}</div>` : ''}
          </div>
          <div class="sf-player-eintrag-dauer">${ep.duration ? ep.duration + ' Min.' : ''}</div>
        </button>
      </li>`).join('');
    return `
      <div class="sf-player">
        <div class="sf-player-kopf">
          ${bild}
          <div class="sf-player-info">
            <div class="sf-player-label">Jetzt anhören</div>
            <div class="sf-player-titel" id="sf-player-titel"></div>
            <div class="sf-player-name">${esc(sf.name)}</div>
            <p class="sf-player-beschreibung" id="sf-player-beschreibung"></p>
          </div>
        </div>
        <div class="sf-player-steuerung">
          <input class="sf-player-balken" id="sf-player-balken" type="range" min="0" max="1000" value="0" aria-label="Position in der Episode" />
          <div class="sf-player-zeiten">
            <span id="sf-player-jetzt">0:00</span>
            <span id="sf-player-gesamt">0:00</span>
          </div>
          <div class="sf-player-knoepfe">
            <button class="sf-player-knopf" id="sf-player-zurueck" type="button" aria-label="${SPRUNG} Sekunden zurück">${ICON_ZURUECK}<span>${SPRUNG}</span></button>
            <button class="sf-player-knopf sf-player-play" id="sf-player-play" type="button" aria-label="Abspielen">${ICON_PLAY}</button>
            <button class="sf-player-knopf" id="sf-player-vor" type="button" aria-label="${SPRUNG} Sekunden vor">${ICON_VOR}<span>${SPRUNG}</span></button>
          </div>
        </div>
        <ul class="sf-player-liste">${liste}</ul>
        <audio id="sf-player-audio" preload="metadata"></audio>
      </div>`;
  }

  function startePlayer(sf, episoden) {
    const audio    = document.getElementById('sf-player-audio');
    const titel    = document.getElementById('sf-player-titel');
    const beschr   = document.getElementById('sf-player-beschreibung');
    const balken   = document.getElementById('sf-player-balken');
    const jetzt    = document.getElementById('sf-player-jetzt');
    const gesamt   = document.getElementById('sf-player-gesamt');
    const playBtn  = document.getElementById('sf-player-play');
    const eintraege = document.querySelectorAll('.sf-player-eintrag');
    let ziehen = false;

    function zeit(sek) {
      if (!isFinite(sek)) return '0:00';
      sek = Math.floor(sek);
      const h = Math.floor(sek / 3600), m = Math.floor((sek % 3600) / 60), s = sek % 60;
      const ss = String(s).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
    }

    function zeigeFortschritt() {
      const prozent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      if (!ziehen) balken.value = prozent * 10;
      balken.style.setProperty('--fortschritt', prozent + '%');
      jetzt.textContent = zeit(audio.currentTime);
    }

    function lade(i, abspielen) {
      const ep = episoden[i];
      audio.src = ep.audio_url;
      titel.textContent = ep.title || '';
      beschr.textContent = ep.description || '';
      gesamt.textContent = ep.duration ? zeit(ep.duration * 60) : '0:00';
      eintraege.forEach(e => e.classList.toggle('aktiv', Number(e.dataset.index) === i));
      zeigeFortschritt();
      if (abspielen) audio.play();
    }

    playBtn.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
    document.getElementById('sf-player-zurueck').addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - SPRUNG);
    });
    document.getElementById('sf-player-vor').addEventListener('click', () => {
      if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + SPRUNG);
    });

    balken.addEventListener('input', () => {
      ziehen = true;
      const prozent = balken.value / 10;
      balken.style.setProperty('--fortschritt', prozent + '%');
      if (audio.duration) jetzt.textContent = zeit(audio.duration * prozent / 100);
    });
    balken.addEventListener('change', () => {
      if (audio.duration) audio.currentTime = audio.duration * balken.value / 1000;
      ziehen = false;
    });

    audio.addEventListener('timeupdate', zeigeFortschritt);
    audio.addEventListener('loadedmetadata', () => { gesamt.textContent = zeit(audio.duration); });
    audio.addEventListener('play',  () => { playBtn.innerHTML = ICON_PAUSE; playBtn.setAttribute('aria-label', 'Pause'); });
    audio.addEventListener('pause', () => { playBtn.innerHTML = ICON_PLAY;  playBtn.setAttribute('aria-label', 'Abspielen'); });

    eintraege.forEach(e => e.addEventListener('click', () => lade(Number(e.dataset.index), true)));

    lade(0, false);
  }

  function zeigeNichtGefunden() {
    inhalt.innerHTML = `
      <div class="sf-not-found">
        <h1>Diesen Sinnfunker gibt es nicht.</h1>
        <p>Vielleicht ist der Link veraltet. <a href="community.html" style="color:var(--gold-deep);">Zurück zur Übersicht</a></p>
      </div>`;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  ladeProfil();
</script>

</html>
