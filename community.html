<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsere Sinnfunker – Sinnfunk</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="image/icon.webp" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    /* Nutzt die gemeinsamen Tokens aus style.css – nur seitenspezifisches Layout. */

    /* ── Suche ── */
    .sf-search-wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 44px;
    }
    .sf-search-box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
    }
    .sf-search-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 14px;
      align-items: end;
    }
    .sf-input-group { display: flex; flex-direction: column; gap: 6px; }
    .sf-input-group label {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--gold-deep);
    }
    .sf-input-group input,
    .sf-input-group select {
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--paper-warm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    .sf-input-group input:focus,
    .sf-input-group select:focus { border-color: var(--gold); }

    .sf-results-count {
      font-family: var(--font-body);
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 12px;
    }

    /* ── Sinnfunker Grid ── */
    .sf-community-wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 0 0 80px;
    }
    .sf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    .sf-loading {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 80px 24px;
      color: var(--muted);
      font-family: var(--font-body);
    }
    .sf-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(168,148,92,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sf-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 24px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .sf-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-3px);
    }
    .sf-card-avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(168,148,92,0.3);
      background: rgba(168,148,92,0.12);
      margin-bottom: 16px;
    }
    .sf-card-avatar-placeholder {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(168,148,92,0.6), rgba(53,61,46,0.5));
      display: grid;
      place-items: center;
      font-size: 2rem;
      color: #fff;
      font-family: var(--font-display);
      margin-bottom: 16px;
    }
    .sf-card-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 20px;
    }
    .sf-card-btn {
      margin-top: auto;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .sf-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
      font-family: var(--font-body);
    }

    @media (max-width: 900px) {
      .sf-search-row { grid-template-columns: 1fr 1fr; }
      .sf-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .sf-search-row { grid-template-columns: 1fr; }
      .sf-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page">

  <div id="sf-nav"></div>
  <script src="nav.js"></script>

  <main>

    <div class="page-hero">
      <p class="eyebrow">Unsere Sinnfunker</p>
      <h1>Stimmen, die etwas zu sagen haben.</h1>
      <p>Alle aktiven Sinnfunker auf Sinnfunk.</p>
    </div>

    <div class="sf-search-wrap">
      <div class="sf-search-box">
        <div class="sf-search-row">
          <div class="sf-input-group">
            <label for="search-name">Name oder Kategorie</label>
            <input type="text" id="search-name"
              placeholder="z.B. Anna, Meditation, Kräuter …"
              oninput="filterSinnfunker()" />
          </div>
          <div class="sf-input-group">
            <label>&nbsp;</label>
            <button class="button secondary" onclick="resetSinnfunker()"
              style="height:46px;">Zurücksetzen</button>
          </div>
        </div>
        <p class="sf-results-count" id="results-count">Wird geladen …</p>
      </div>
    </div>
    <div class="sf-community-wrap">
      <div class="sf-grid" id="sf-grid">
        <div class="sf-loading">
          <div class="sf-spinner"></div>
          <p>Sinnfunker werden geladen …</p>
        </div>
      </div>
    </div>

  </main>

 <div id="sf-footer"></div>
    <script src="footer.js"></script>

</div>

<script>
  const SUPABASE_URL  = 'https://mliatnfqgnctbxhbwhzp.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_KocEqg2UUL2trsGXb_kacA_yfY8DIP3';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  let alleSinnfunker = [];

  // ── Sinnfunker laden ──────────────────────────────────────────────────────

  async function ladeSinnfunker() {
    const { data, error } = await db
      .from('sinnfunker')
      .select('id, slug, name, subtitle, biography, photo_url, website, facebook, instagram, extra_link, category')
      .in('status', ['aktiv', 'freigegeben']) // intern und andere Status werden nicht angezeigt
      .order('name');

    if (error) { zeigeError(error.message); return; }
    alleSinnfunker = data || [];
    renderSinnfunker(alleSinnfunker);
  }

  function renderSinnfunker(liste) {
    const grid = document.getElementById('sf-grid');
    if (liste.length === 0) {
      grid.innerHTML = `<div class="sf-empty"><p>Kein Sinnfunker gefunden.</p></div>`;
      document.getElementById('results-count').textContent = '0 Sinnfunker gefunden';
      return;
    }
    grid.innerHTML = liste.map(s => karteHTML(s)).join('');
    const n = liste.length;
    document.getElementById('results-count').textContent =
      n === 1 ? '1 Sinnfunker gefunden' : n + ' Sinnfunker gefunden';
  }

  function karteHTML(s) {
    const initial = s.name ? s.name.charAt(0).toUpperCase() : '?';
    const avatar = s.photo_url
      ? `<img class="sf-card-avatar" src="${esc(s.photo_url)}" alt="${esc(s.name)}" />`
      : `<div class="sf-card-avatar-placeholder">${initial}</div>`;
    const profilLink = s.slug ? `sinnfunker.html?name=${encodeURIComponent(s.slug)}` : 'community.html';
    const buttonText = s.name ? `Alles über ${esc(s.name)}` : 'Mehr Info';
    return `
      <article class="sf-card"
        data-name="${esc(s.name)}"
        data-category="${esc(s.category || '')}"
        data-biography="${esc(s.biography || '')}"
        data-subtitle="${esc(s.subtitle || '')}">
        ${avatar}
        <div class="sf-card-name">${esc(s.name)}</div>
        <a class="button gold sf-card-btn" href="${esc(profilLink)}">${buttonText}</a>
      </article>`;
  }

  function filterSinnfunker() {
    const q = document.getElementById('search-name').value.toLowerCase();
    const gefiltert = alleSinnfunker.filter(s => {
      const text = [s.name, s.biography, s.subtitle, s.category].join(' ').toLowerCase();
      return !q || text.includes(q);
    });
    renderSinnfunker(gefiltert);
  }

  function resetSinnfunker() {
    document.getElementById('search-name').value = '';
    renderSinnfunker(alleSinnfunker);
  }

  // ── Fehler ────────────────────────────────────────────────────────────────

  function zeigeError(msg) {
    document.getElementById('sf-grid').innerHTML = `
      <div class="sf-empty">
        <p>Die Sinnfunker konnten nicht geladen werden.</p>
        ${msg ? `<p style="font-size:0.82rem;margin-top:8px;">${esc(msg)}</p>` : ''}
      </div>`;
    document.getElementById('results-count').textContent = '';
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  ladeSinnfunker();
</script>
</body>
</html>
